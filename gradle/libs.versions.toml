# dmap3 version catalog.
#
# These are STARTING PINS, not verified-together versions — the scaffold was
# written without a network to resolve them. First job in P0b is
# `./gradlew build` and reconciling whatever this gets wrong. Treat a version
# bump here as a PR of its own, never a drive-by inside a feature branch.
#
# One trade-off worth knowing about before you bump Kotlin:
#   Kotlin 2.4.20-Beta2+ generates the Swift Package Manager manifest
#   automatically alongside the XCFramework. The pin below is older and
#   stable, so iosApp wires the XCFramework up by hand (see iosApp/README.md).
#   When you move to a Kotlin that has the SPM export task, delete that manual
#   wiring — it exists only to avoid starting the project on a beta compiler.

[versions]
kotlin = "2.1.21"
agp = "9.4.1"
compose-bom = "2024.10.01"
coroutines = "1.9.0"
serialization = "1.7.3"
ktor = "3.6.0"
room = "2.8.5"          # KMP-capable Room. Pin the stable 2.7.x line
sqlite = "2.8.0-alpha03"        #   when it lands; do NOT jump to Room 3.0 (alpha).
datastore = "1.3.0"
maplibre-android = "13.7.1"     # carried over from dmap2, known good
androidx-core = "1.19.1"
androidx-lifecycle = "2.8.7"
androidx-activity = "1.9.3"
ksp = "2.3.12"
junit = "4.13.2"

compileSdk = "35"
minSdk = "26"
targetSdk = "35"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

maplibre-android = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre-android" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
