# Tuned for a 16 GB machine that also runs Docker, Xcode and a simulator.
# Cap the daemons rather than letting them grow into swap.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Kotlin/Native: keep the compiler in a daemon so iOS builds are not
# cold-started on every invocation.
kotlin.native.ignoreDisabledTargets=true
